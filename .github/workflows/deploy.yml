# Builds the site and publishes it to GitHub Pages at https://pikalokate.github.io.
# Runs on every push to main and every 6 hours, so the GitHub calendar stays fresh.
# Optional: a CONTRIBUTIONS_TOKEN secret (a classic token with only the read:user scope)
# makes sure private contribution counts are included. Without it, the built-in token is used,
# and the fetch script keeps the saved calendar if the new numbers come back much lower.

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch GitHub contributions
        run: npm run contributions
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://pikalokate.github.io
          NEXT_TELEMETRY_DISABLED: 1
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
